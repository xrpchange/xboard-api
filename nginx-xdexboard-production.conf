# XBoard / xdexboard.com — production on server@xrpchange.site
# PHP-FPM (no Apache). CORS only in nginx snippets — not in Laravel/Core PHP.
#
# Snippets (copy to /etc/nginx/snippets/):
#   xboard-cors-api.conf, xboard-cors-core.conf
#
# Document roots:
#   /var/www/xboard-api/public   — api.*.xdexboard.com
#   /var/www/xboard-core/public  — api.core.*.xdexboard.com
#   /var/www/xdexboard-web       — xdexboard.com

server {
    listen 80;
    listen [::]:80;
    server_name
        xdexboard.com
        api.xdexboard.com sandbox.api.xdexboard.com dev.api.xdexboard.com
        api.core.xdexboard.com sandbox.api.core.xdexboard.com dev.api.core.xdexboard.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xdexboard.com;

    ssl_certificate     /etc/letsencrypt/live/api.xdexboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xdexboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xdexboard-web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|wasm|woff2?|ttf|svg|png|jpe?g|gif|ico|json|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xdexboard.com;

    ssl_certificate     /etc/letsencrypt/live/api.xdexboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xdexboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xboard-api/public;
    index index.php;
    client_max_body_size 1G;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/payments/email-attachments/ {
        rewrite ^ /index.php last;
    }

    location / {
        include snippets/xboard-cors-api.conf;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/xboard-cors-api.conf;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }
}

