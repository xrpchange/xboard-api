server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.core.xdexboard.com;

    ssl_certificate     /etc/letsencrypt/live/api.xdexboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xdexboard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xboard-core/public;
    index api.php;
    client_max_body_size 1G;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include snippets/xboard-cors-core.conf;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ =404;
    }

    location ~ ^/api(/|$) {
        include snippets/xboard-cors-core.conf;
        if ($request_method = OPTIONS) {
            return 204;
        }
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        include snippets/xboard-cors-core.conf;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }
}

