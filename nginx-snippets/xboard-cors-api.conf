add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With, X-Escrow-Token, X-Admin-Key, X-User-Role, X-Device-ID, X-XSRF-TOKEN" always;
add_header Access-Control-Max-Age 86400 always;
include snippets/xboard-noindex.conf;
