# PhpMyAdmin under /phpmyadmin/ (root /usr/share/phpmyadmin). Include inside server { } before SPA location /.
# Legacy: apex used to serve phpMyAdmin at /index.php before the web SPA.
location = /index.php {
    return 302 /phpmyadmin/index.php$is_args$args;
}

location /phpmyadmin {
    root /usr/share;
    index index.php;
    client_max_body_size 64M;

    location ~ ^/phpmyadmin/(.+\.php)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/$1;
        fastcgi_read_timeout 300;
    }
}
