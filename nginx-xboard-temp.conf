# Temporary Nginx configuration for XBoard (without SSL)
# Use this configuration to get SSL certificates first

# HTTP configuration (temporary for certificate generation)
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.api.xdexboard.com api.xdexboard.com;
    
    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }
    
    # Proxy to XBoard (temporary without HTTPS redirect)
    location / {
        proxy_pass http://192.168.1.31:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Keepalive settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API: CORS only on upstream Apache (httpd-vhosts). Do not add_header here — duplicate Allow-Origin breaks browsers.
    location /api/ {
        proxy_pass http://192.168.1.31:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
