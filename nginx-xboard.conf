    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Client settings (identical to sandbox)
    client_max_body_size 1G;
    
    # Main proxy location (identical to sandbox configuration)
    # Forwards all production requests to XBoard application
    location / {
        # Forward requests to XBoard application server
        proxy_pass http://192.168.1.31:80;
        
        # Essential proxy headers for proper request handling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Keepalive optimization for better performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Buffering settings for real-time responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        
        # Timeout settings (60 seconds for all operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API specific settings (identical to sandbox for consistency)
    # Enhanced configuration for production API endpoints with CORS support
    location /api/ {
        # Forward API requests to XBoard application
        proxy_pass http://192.168.1.31:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS: Laravel does not emit CORS. If upstream Apache (httpd-vhosts) already sends Access-Control-*,
        # do not add duplicate add_header here. If upstream has no CORS, add a single policy in this location.
    }
}
