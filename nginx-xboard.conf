# Nginx configuration for XBoard API
# 
# This configuration provides:
# - HTTP to HTTPS redirect for both sandbox and production domains
# - SSL termination with Let's Encrypt certificates
# - Reverse proxy to XBoard application (192.168.1.31:80)
# - CORS headers for API endpoints
# - Security headers (HSTS, X-Frame-Options, etc.)
# - HTTP/2 support
# - Keepalive optimization
#
# Domains:
# - sandbox.api.xdexboard.com (sandbox environment)
# - api.xdexboard.com (production environment)
#
# Installation:
# 1. Copy to /etc/nginx/sites-available/xboard
# 2. Create symlink: ln -s /etc/nginx/sites-available/xboard /etc/nginx/sites-enabled/
# 3. Remove default: rm /etc/nginx/sites-enabled/default
# 4. Test: nginx -t
# 5. Reload: systemctl reload nginx
#
# SSL Certificates:
# Both domains use the same certificate from /etc/letsencrypt/live/api.xdexboard.com/
# This is created by Certbot with --expand flag to include both domains

# HTTP to HTTPS redirect
# This server block handles all HTTP traffic and redirects to HTTPS
# Also serves Let's Encrypt ACME challenges for certificate renewal
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.api.xdexboard.com api.xdexboard.com;
    
    # Let's Encrypt ACME challenge directory
    # Required for certificate generation and renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    # Preserves the original server_name in redirect
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS configuration for sandbox environment
# Handles all HTTPS traffic for sandbox.api.xdexboard.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sandbox.api.xdexboard.com;
    
    # SSL certificates (shared with production domain)
    # Both domains use the same certificate created with --expand flag
    ssl_certificate /etc/letsencrypt/live/api.xdexboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xdexboard.com/privkey.pem;
    
    # SSL configuration - modern, secure settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # Security headers for enhanced security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Client settings - allow large file uploads
    client_max_body_size 1G;
    
    # Main proxy location - forwards all requests to XBoard application
    location / {
        # Forward requests to XBoard application server
        proxy_pass http://192.168.1.31:80;
        
        # Essential proxy headers for proper request handling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Keepalive optimization for better performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Buffering settings for real-time responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_intercept_errors on;
        
        # Timeout settings (60 seconds for all operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API specific settings - enhanced configuration for API endpoints
    # This location block handles all /api/* requests with CORS support
    location /api/ {
        # Forward API requests to XBoard application
        proxy_pass http://192.168.1.31:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS: Laravel does not emit CORS. If upstream Apache (httpd-vhosts) already sends Access-Control-*,
        # do not add duplicate add_header here. If upstream has no CORS, add a single policy in this location.
    }
}

# HTTPS configuration for production environment
# Handles all HTTPS traffic for api.xdexboard.com (production)
# Identical configuration to sandbox for consistency
