# Laravel app + scheduler cron logs (xboard-api).
# Installed by scripts/install-laravel-scheduler-cron.sh → /etc/logrotate.d/xboard-api
/var/www/xboard-api/storage/logs/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su www-data www-data
}
