# PHP email verifier (Postfix pipe).
# Install: sudo cp scripts/email-server/logrotate-xboard-email.conf /etc/logrotate.d/xboard-email
# Or: sudo bash scripts/email-server/install-logrotate.sh
/var/log/xboard-email/verifier.log {
    daily
    rotate 7
    size 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
