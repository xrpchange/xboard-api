# Temporary HTTP-only for certbot (replaced by nginx-xdexboard-production.conf after certs)
server {
    listen 80;
    listen [::]:80;
    server_name
        xdexboard.com
        api.xdexboard.com sandbox.api.xdexboard.com dev.api.xdexboard.com
        api.core.xdexboard.com sandbox.api.core.xdexboard.com dev.api.core.xdexboard.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 200 'pending cert';
        add_header Content-Type text/plain;
    }
}
