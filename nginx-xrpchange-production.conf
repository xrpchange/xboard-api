        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control $xboard_web_asset_cache always;
    }

    location ~* \.(?:css|js|wasm|woff2?|ttf|svg|png|jpe?g|gif|ico|json|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control $xboard_web_asset_cache always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xrpchange.site;

    ssl_certificate     /etc/letsencrypt/live/xrpchange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrpchange.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xboard-api/public;
    index index.php;
    client_max_body_size 1G;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/payments/email-attachments/ {
        rewrite ^ /index.php last;
    }

    location / {
        include snippets/xboard-cors-api.conf;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/xboard-cors-api.conf;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }
}

