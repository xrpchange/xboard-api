# XBoard — xrpchange.site (web + API on server@xrpchange.site / supersrv)
# PHP-FPM. CORS in snippets/xboard-cors-api.conf — not in Laravel.
#
# Deploy: scp to /etc/nginx/sites-available/xrpchange.conf
#         ln -sf .../xrpchange.conf /etc/nginx/sites-enabled/
#         certbot expand (see scripts/deploy-xrpchange-production.sh)
#         nginx -t && systemctl reload nginx
#
# Document roots:
#   /var/www/xrpchange-web      — xrpchange.site, dev.xrpchange.site
#   /var/www/xboard-api/public  — api.*.xrpchange.site

map $uri $xboard_web_asset_cache {
    default "public, max-age=31536000, immutable";
    ~^/(index\.html|sw\.js|push-sw\.js)$ "no-cache, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name
        xrpchange.site www.xrpchange.site dev.xrpchange.site www.dev.xrpchange.site
        api.xrpchange.site dev.api.xrpchange.site sandbox.api.xrpchange.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xrpchange.site www.xrpchange.site;

    ssl_certificate     /etc/letsencrypt/live/xrpchange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrpchange.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xrpchange-web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    include snippets/xboard-phpmyadmin-location.conf;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control $xboard_web_asset_cache always;
    }

    location ~* \.(?:css|js|wasm|woff2?|ttf|svg|png|jpe?g|gif|ico|json|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control $xboard_web_asset_cache always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.xrpchange.site www.dev.xrpchange.site;

    ssl_certificate     /etc/letsencrypt/live/xrpchange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrpchange.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xrpchange-web;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    include snippets/xboard-phpmyadmin-location.conf;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

