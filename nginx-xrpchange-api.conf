# Nginx reverse proxy for xboard-api on *.xrpchange.site (production / sandbox / dev API hosts).
# Upstream Apache (httpd-vhosts) already sets Access-Control-* — do NOT duplicate add_header here.
# Symptom if duplicated: browser error "Allow-Origin contains multiple values '*, *'".
#
# Deploy: include or merge into sites-enabled, then nginx -t && systemctl reload nginx.
# Strip legacy blocks: scripts/nginx_strip_duplicate_api_cors.py /path/to/this-or-sites-enabled.conf

# HTTP → HTTPS redirect (adjust server_name list to match your certs)
server {
    listen 80;
    listen [::]:80;
    server_name api.xrpchange.site dev.api.xrpchange.site sandbox.api.xrpchange.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — one server block per cert SAN, or split if you use separate certs per host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.xrpchange.site dev.api.xrpchange.site sandbox.api.xrpchange.site;

    # ssl_certificate /etc/letsencrypt/live/.../fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/.../privkey.pem;

    client_max_body_size 1G;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # No add_header Access-Control-* — Apache vhost for api.xrpchange.site handles CORS + OPTIONS.
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
